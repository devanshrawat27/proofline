# Proofline local development infrastructure.
# Usage: pnpm dev:infra
name: proofline

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proofline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofline}
      POSTGRES_DB: ${POSTGRES_DB:-proofline}
    ports:
      - "5432:5432"
    volumes:
      - proofline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proofline} -d ${POSTGRES_DB:-proofline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - proofline-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-proofline}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-proofline}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - proofline-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the private documents bucket, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-proofline} ${S3_SECRET_KEY:-proofline} &&
      mc mb --ignore-existing local/${S3_BUCKET:-proofline-documents} &&
      mc anonymous set none local/${S3_BUCKET:-proofline-documents} &&
      echo 'MinIO bucket ready';
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  proofline-postgres:
  proofline-redis:
  proofline-minio:
