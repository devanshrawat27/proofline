name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goodsignal
          POSTGRES_PASSWORD: goodsignal
          POSTGRES_DB: goodsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodsignal -d goodsignal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://goodsignal:goodsignal@localhost:5432/goodsignal?schema=public
      SESSION_SECRET: ci-only-secret-value-not-used-in-production-0000
      SESSION_COOKIE_NAME: goodsignal_session
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @goodsignal/api exec prisma generate

      - name: Validate migrations on a clean database
        run: pnpm --filter @goodsignal/api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
